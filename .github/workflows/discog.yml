name: build-discography

on:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [ main ]

jobs:
  discog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      NEOCITIES_API_TOKEN: ${{ secrets.NEOCITIES_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate discography JSON (all artists)
        run: npm run discog

      - name: Commit changes
        run: |
          git config user.name "aery bot"
          git config user.email "bot@aeryrecords.com"
          mkdir -p public/discog
          git add public/discog/*.json
          git diff --quiet && echo "No changes" || git commit -m "chore(discog): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

      - name: Deploy to Neocities
        if: ${{ env.NEOCITIES_API_TOKEN != '' }}
        uses: bcomnes/deploy-to-neocities@v2
        with:
          api_token: ${{ env.NEOCITIES_API_TOKEN }}
          cleanup: false
          dist_dir: public