name: build-discography

on:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [ main ]

jobs:
  # 1) scrape per-artist (sequential to avoid git conflicts)
  discog:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        artist: [ "nixiehalcyon", "partyboob420" ]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate discography JSON for ${{ matrix.artist }}
        run: node scripts/scrape-bandcamp.js ${{ matrix.artist }}

      - name: Commit & push changes for ${{ matrix.artist }}
        run: |
          set -e
          git config user.name "aery bot"
          git config user.email "bot@aeryrecords.com"
          mkdir -p public/discog
          git add public/discog/${{ matrix.artist }}.json

          # only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.artist }}"
          else
            git commit -m "discog: ${{ matrix.artist }} $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            # rebase onto latest remote main to avoid non-fast-forward
            git fetch origin main
            git pull --rebase origin main

            # push with a tiny retry in case of a very rare race
            git push origin HEAD:main || { 
              echo "Push failed, retrying once after rebase…"
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi

  # 2) deploy once after all artists have been processed
  deploy:
    needs: discog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEOCITIES_API_TOKEN: ${{ secrets.NEOCITIES_API_TOKEN }}

    steps:
      - name: Checkout (latest pushed content)
        uses: actions/checkout@v4

      - name: Deploy to Neocities
        if: ${{ env.NEOCITIES_API_TOKEN != '' }}
        uses: bcomnes/deploy-to-neocities@v2
        with:
          api_token: ${{ env.NEOCITIES_API_TOKEN }}
          cleanup: false
          dist_dir: public